name = "hanzo-id"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# All IAM login domains route through this single worker.
# The worker resolves org-specific branding from the request hostname.
# DNS must be proxied through Cloudflare (orange cloud) for each domain.
routes = [
  { pattern = "hanzo.id/*", zone_name = "hanzo.id" },
  { pattern = "lux.id/*", zone_name = "lux.id" },
  { pattern = "pars.id/*", zone_name = "pars.id" },
  { pattern = "iam.lux.network/*", zone_name = "lux.network" },
  { pattern = "id.lux.network/*", zone_name = "lux.network" },
  { pattern = "id.zoo.network/*", zone_name = "zoo.network" },
]

[vars]
# IAM backend (consumed via `env.IAM_ORIGIN` with fallback to the module-level
# constant — see worker.js).
IAM_ORIGIN = "https://iam.hanzo.ai"

# Default org slug when the hostname has no tenant catalog entry.
IAM_DEFAULT_ORG = "hanzo"

# Tenant catalog (env-driven, NOT hardcoded in source). Maps request
# hostnames to `{ orgId, iamUrl?, clientId?, ... }` overrides. Same JSON
# schema as the Next.js side (`lib/config.ts::TenantConfig`); only `orgId`
# is consumed by this worker. To rotate tenants, edit this var (or use
# `wrangler secret put IAM_TENANT_CONFIG_JSON` for non-public catalogs)
# and redeploy — no source change.
IAM_TENANT_CONFIG_JSON = """
{
  "hanzo.id":       { "orgId": "hanzo" },
  "lux.id":         { "orgId": "lux" },
  "id.lux.network": { "orgId": "lux" },
  "iam.lux.network":{ "orgId": "lux" },
  "zoo.id":         { "orgId": "zoo" },
  "id.zoo.network": { "orgId": "zoo" },
  "id.zoo.ngo":     { "orgId": "zoo" },
  "pars.id":        { "orgId": "pars" },
  "id.pars.network":{ "orgId": "pars" }
}
"""

# Proxy to the Pages deployment for the marketing site
MARKETING_ORIGIN = "https://hanzo-id.pages.dev"
